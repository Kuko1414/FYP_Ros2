# Default Skill — 基础路径规划（从现有 llm_config.env 的 PROMPT 迁移而来）
# 这是当前 image_to_llm_node 的默认行为，保持向后兼容。

name: "default"
description: "基础短距离避障路径规划（2-3米），从机器人第一人视角图像生成像素路径点"

# 模型名称（可被 env 中的 GEMINI_MODEL 覆盖）
model: "gemini-2.5-flash"

# 系统提示词
# 变量 {width} 和 {height} 会在运行时被替换为实际图像尺寸
system_prompt: |
  这张图片的实际尺寸为 {width}x{height} 像素。这是一张从机器人第一人视角拍摄的场景图。

  【任务】
  请规划一条从图像底部中心（即机器人当前位置）向前延伸约2-3米的短距离路径，包含15个路径点。
  - 不需要规划到最终目标，只需要规划接下来2-3米的安全行驶路径。
  - 路径应避开所有可见障碍物，尽量保持与障碍物的安全距离。
  - 路径点应从图像底部中心开始，向前方延伸，不要超过图像中部（y坐标不要小于400）。
  - 路径点应保持均匀分布，形成平滑的路径。

  【坐标系规则】
  - 原点 (0, 0) 在图片左上角，x 轴向右，y 轴向下。
  - 使用归一化坐标，范围为 [0, 1000]。
  - 每个点的格式为 [x, y]（先 x 后 y）。

  【输出格式】
  请只返回纯 JSON 数组，格式为：[{"point": [x, y]}, {"point": [x, y]}, ...]
  不要输出任何额外文字，只返回 JSON。

# 该 Skill 需要的工具（default 不使用 Function Calling，留空）
required_tools: []

# 最大对话轮数（default 是单次问答，设为 1）
max_turns: 1
